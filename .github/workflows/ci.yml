name: CI on demand

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux checks in the Fedora compatibility container
    runs-on: ubuntu-24.04
    container:
      image: registry.fedoraproject.org/fedora@sha256:a9f7d4b1147b4d1f7dd5ec90081cf2cc91f7ffde849f61f69a43127b18390775 # Fedora 44
    defaults:
      run:
        shell: bash
    timeout-minutes: 20

    steps:
      - name: Install Fedora dependencies
        run: >-
          dnf -y --setopt=install_weak_deps=False install
          at-spi2-core
          dbus-daemon
          git
          gobject-introspection
          gtk4
          libadwaita
          make
          pipewire-utils
          procps-ng
          python3-gobject
          shellcheck
          uv
          wl-clipboard
          && dnf clean all

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test and lint Linux client
        run: make linux-test linux-shortcut-test

      - name: Lint shell scripts
        run: shellcheck install.sh linux/*.sh linux/tests/*.sh dev/*.sh linux/mluva-shell
