[workspace]
members = ["rust/mluva-core", "rust/mluva-gtk", "rust/mluva-audio", "rust/mluva-providers", "rust/mluva-asr", "rust/mluva-workflows", "rust/mluva-shell", "rust/mluva-install", "rust/mluva-web"]
resolver = "3"

[workspace.package]
version = "2.2.2"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/1vecera/Mluva"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["arbitrary_precision", "preserve_order"] }
thiserror = "2.0.18"
regex = "1.13.1"
url = "2.5"
tempfile = "3"
rusqlite = { version = "0.40.2", features = ["functions"] }
chrono = { version = "0.4.44", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
caseless = "0.2.2"
base64 = "0.22"
crc32fast = "1.5"
libc = "0.2"
unicode-normalization = "=0.1.24"
gtk = { package = "gtk4", version = "0.10.3", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.8.1", features = ["v1_5"] }
glib = "0.21.5"
gio = "0.21.5"
toml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "process", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.12", features = ["stream"] }
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }
futures-util = { version = "0.3", features = ["sink"] }
