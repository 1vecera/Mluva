[workspace]
members = ["rust/mluva-core"]
resolver = "3"

[workspace.package]
version = "1.6.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/1vecera/Mluva"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["arbitrary_precision", "preserve_order"] }
thiserror = "2.0.18"
regex = "1.13.1"
url = "2.5"
tempfile = "3"
rusqlite = { version = "0.40.2", features = ["functions"] }
chrono = { version = "0.4.44", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
caseless = "0.2.2"
base64 = "0.22"
crc32fast = "1.5"
libc = "0.2"
