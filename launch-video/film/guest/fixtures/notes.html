<!doctype html>
<meta charset="utf-8">
<title>Launch notes</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #12141f; color: #e6e8f0; font: 17px/1.55 "Adwaita Sans", "Noto Sans", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 26px 34px; }
  .crumb { font: 12px "JetBrainsMono Nerd Font", monospace; color: #7f86a3; letter-spacing: .04em; }
  h1 { font-size: 32px; font-weight: 650; margin: 6px 0 14px; letter-spacing: -.012em; }
  .note { border-left: 2px solid #2c3150; padding: 1px 0 1px 16px; margin: 0 0 14px; }
  .note b { display: block; font-weight: 600; font-size: 14px; color: #c8cde4; }
  .note p { margin: 0; color: #9aa1bd; font-size: 15px; }
  label { display: block; font: 12px "JetBrainsMono Nerd Font", monospace; color: #7f86a3; margin: 16px 0 8px; letter-spacing: .04em; }
  textarea { box-sizing: border-box; width: 100%; height: 118px; resize: none; background: #0c0e17; color: #f3f4fa;
    border: 1px solid #333959; border-radius: 10px; padding: 15px 17px; font: 500 21px/1.42 "Adwaita Sans", "Noto Sans", sans-serif; caret-color: #8aa6ff; outline: none; }
  textarea:focus { border-color: #5e6ea8; }
</style>
<main>
  <div class="crumb">TEAM / LAUNCH</div>
  <h1>Launch notes</h1>
  <div class="note"><b>Film</b><p>The new take is in. Cut it to the words.</p></div>
  <label for="reply">YOUR NOTE</label>
  <textarea id="reply" aria-label="Your note" autofocus></textarea>
</main>
<script>document.getElementById("reply").focus();</script>
