[package]
name = "mluva-annotate"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Screen annotation marks, keyframe selection and bundle rendering"

[features]
# Cairo/Pango keyframe drawing. Platforms with their own renderer use `bundle::plan` and
# `bundle::finish` without it.
default = ["render"]
render = ["dep:cairo-rs", "dep:gdk-pixbuf", "dep:pango", "dep:pangocairo"]

[dependencies]
mluva-core = { path = "../mluva-core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
libc.workspace = true
cairo-rs = { version = "0.21", features = ["png"], optional = true }
gdk-pixbuf = { version = "0.21", optional = true }
pango = { version = "0.21", optional = true }
pangocairo = { version = "0.21", optional = true }
tempfile.workspace = true


[[test]]
name = "bundle"
required-features = ["render"]
