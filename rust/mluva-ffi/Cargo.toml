[package]
name = "mluva-ffi"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "C ABI over the shared Mluva core for native desktop shells such as macOS"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
mluva-core = { path = "../mluva-core" }
mluva-providers = { path = "../mluva-providers" }
mluva-workflows = { path = "../mluva-workflows" }
mluva-annotate = { path = "../mluva-annotate", default-features = false }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
