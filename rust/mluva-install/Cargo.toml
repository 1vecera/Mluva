[package]
name = "mluva-install"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Native installation and upgrade ownership for Mluva"

[dependencies]
serde_json.workspace = true
tempfile.workspace = true
sha2 = "0.11.0"
libc.workspace = true

[dev-dependencies]
regex.workspace = true

[[bin]]
name = "mluva-install-widget"
path = "src/widget.rs"

[[bin]]
name = "mluva-package"
path = "src/package.rs"

[[bin]]
name = "mluva-screenshot-editor"
path = "src/editor.rs"

[[bin]]
name = "mluva-uninstall"
path = "src/uninstall.rs"

[[bin]]
name = "mluva-install"
path = "src/install.rs"

[[bin]]
name = "editor-launcher-fixture-peer"
path = "tests/support/editor_peer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "install-dependency-fixture-peer"
path = "tests/support/install_peer.rs"
test = false
doc = false
bench = false
