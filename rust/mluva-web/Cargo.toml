[package]
name = "mluva-web"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Private browser recording companion for the local Mluva desktop"

[dependencies]
mluva-core = { path = "../mluva-core" }
mluva-providers = { path = "../mluva-providers" }
mluva-audio = { path = "../mluva-audio" }
axum = "=0.8.9"
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["rust_crypto"] }
tokio.workspace = true
reqwest = { workspace = true, features = ["json"] }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
uuid.workspace = true
rusqlite.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
base64.workspace = true
